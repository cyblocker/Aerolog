<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="55%" stop-color="#141c38" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glowIndigo" cx="22%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="82%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#glowIndigo)" />
  <rect width="512" height="512" rx="116" fill="url(#glowCyan)" />

  <!-- Subtle curved flight arc behind aircraft -->
  <path
    d="M 104 374 Q 178 214 398 134"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="18 16"
  />
  <circle cx="104" cy="374" r="10" fill="#06b6d4" fill-opacity="0.75" />

  <!-- Centered sleek commercial jet rotated 45 deg northeast -->
  <g transform="translate(256, 256) rotate(45) scale(1.03)">
    <path
      d="M 0 -142
         C 11 -142, 16 -112, 16 -84
         L 16 -46
         L 140 32
         C 145 36, 145 45, 140 52
         L 134 54
         L 16 18
         L 11 92
         L 58 124
         L 58 140
         L 9 122
         C 4 136, 2 140, 0 140
         C -2 140, -4 136, -9 122
         L -58 140
         L -58 124
         L -11 92
         L -16 18
         L -134 54
         L -140 52
         C -145 45, -145 36, -140 32
         L -16 -46
         L -16 -84
         C -16 -112, -11 -142, 0 -142 Z"
      fill="url(#planeGrad)"
    />
  </g>
</svg>
